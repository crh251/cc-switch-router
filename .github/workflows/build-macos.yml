name: Build macOS arm64 (patched cc-switch)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "cc-switch 版本（仅支持已适配补丁的版本；push 触发时忽略此项，自动取 patches/ 里最新版本）"
        type: choice
        required: true
        default: v3.20.1
        options:
          - v3.20.1
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

# 新推送取消仍在跑的旧构建，避免排队浪费
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout (patch script & workflow)
        uses: actions/checkout@v6

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # push 触发：自动取 patches/ 里版本号最大的补丁
            VERSION=$(ls patches/*.patch | sed 's|patches/||; s|\.patch$||' | sort -V | tail -1)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Build version: $VERSION"

      - name: Download cc-switch source
        run: |
          curl -fsSL "https://github.com/farion1231/cc-switch/archive/refs/tags/${VERSION}.tar.gz" -o /tmp/src.tar.gz
          mkdir src
          tar -xzf /tmp/src.tar.gz -C src --strip-components=1

      - name: Apply patch
        working-directory: src
        # 注意：必须用 patch（按 CWD 解析路径）。git apply 在仓库子目录里会按
        # 仓库根解析路径，导致补丁静默落空。
        run: patch -p1 --batch -i "../patches/${VERSION}.patch"

      - name: Stamp version with commit id
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i '' "s/\"version\": \"3.20.1\"/\"version\": \"3.20.1+${SHORT_SHA}\"/" src/src-tauri/tauri.conf.json
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          grep '"version"' src/src-tauri/tauri.conf.json

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install pnpm
        working-directory: src
        run: |
          corepack enable
          corepack install

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ hashFiles('src/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install frontend deps
        working-directory: src
        run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Build .app (aarch64)
        working-directory: src
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app

      - name: Stamp commit id into About panel (CFBundleVersion)
        run: |
          APP_DIR="src/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          PLIST="$APP_DIR/CC Switch Router.app/Contents/Info.plist"
          SHORT_VERSION="${VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $SHORT_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $SHORT_SHA" "$PLIST"
          echo "About panel -> Version $SHORT_VERSION ($SHORT_SHA)"

      - name: Pack DMG (create-dmg, official style)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          APP_DIR="src/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          APP_NAME="CC Switch Router.app"
          DMG_NAME="CC-Switch-${VERSION}-macos-arm64-ccs.dmg"
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # 注意：只拷贝 .app 本体；若 ditto 整个 bundle/macos 目录会把真 app 套娃进假壳里
          ditto "$APP_DIR/$APP_NAME" "$STAGE/$APP_NAME"
          create-dmg \
            --volname "CC Switch Router" \
            --background "src/src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "$APP_NAME" 180 220 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 480 220 \
            "$DMG_NAME" \
            "$STAGE"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "$DMG_NAME" \
            --title "CC Switch $VERSION (x-ccs-provider patched, macOS arm64)" \
            --notes "补丁版：支持 x-ccs-provider 请求头按终端路由供应商。未签名，首次打开执行 xattr -cr 去隔离。" \
            --latest || gh release upload "$VERSION" "$DMG_NAME" --clobber
